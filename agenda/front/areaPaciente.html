<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda Médica - Paciente</title>
    <link rel="stylesheet" href="/css/areaPaciente.css" />
    <link rel="shortcut icon" href="/img/estetoscopio.png" type="image/x-icon">
</head>
<body>
<div class="container">
    <h2>Agendar Consulta</h2>

    <form id="form-agendar">
        <div class="form-group select-group">
            <div class="form-group" style="flex:1">
                <label for="medico">Selecione o Médico</label>
                <select id="medico">
                    <option value="">Carregando médicos...</option>
                </select>
            </div>
            <div class="form-group" style="flex:1">
                <label for="horarioDisponivel">Horário Disponível</label>
                <select id="horarioDisponivel">
                    <option value="">Selecione um médico primeiro</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="tituloConsulta">Título da Consulta</label>
            <input type="text" id="tituloConsulta" placeholder="Ex: Avaliação geral" required />
        </div>

        <div class="form-group">
            <label for="descricaoConsulta">Descrição / Triagem</label>
            <textarea id="descricaoConsulta" placeholder="Descreva brevemente o motivo da consulta..."></textarea>
        </div>

        <input type="submit" value="Agendar Consulta" />
    </form>

    <h2 style="margin-top:40px;">Minhas Consultas</h2>
    <table>
        <thead>
        <tr>
            <th>Médico</th>
            <th>Data</th>
            <th>Hora</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody id="tabelaConsultas">
        <tr><td colspan="4">Carregando consultas...</td></tr>
        </tbody>
    </table>
</div>

<script src="/js/areaPaciente.js"></script>
</body>
</html>
