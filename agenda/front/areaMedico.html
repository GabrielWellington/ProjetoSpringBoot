<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Área do Médico — Agenda</title>
    <link rel="stylesheet" href="/css/areaMedico.css">
</head>
<body>
<div class="container">
    <header>
        <div class="brand">
            <div class="logo">MD</div>
            <div>
                <h1>Área do Médico</h1>
                <div class="meta">Visualize consultas e defina suas disponibilidades</div>
            </div>
        </div>

        <div class="controls">
            <div class="meta" id="medicoNome">Olá, Médico</div>
            <button class="btn logout" onclick="localStorage.removeItem('idMedico'); window.location.href='/login'">Sair</button>
        </div>
    </header>

    <main class="grid">
        <!-- 🔹 Card de Consultas -->
        <section class="card">
            <h3>Minhas Consultas</h3>
            <div style="overflow:auto">
                <table id="tabelaConsultas" aria-live="polite">
                    <thead>
                    <tr>
                        <th>Paciente</th>
                        <th>Data</th>
                        <th>Horário</th>
                        <th>Status</th>
                        <th style="width:240px">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr><td colspan="5" class="muted" style="padding:18px;text-align:center">Carregando...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- 🔹 Card de Disponibilidades -->
        <section class="card">
            <h3>Minhas Disponibilidades</h3>
            <button class="btn btn-primary btn-small" onclick="abrirModalDisponibilidade()">+ Nova Disponibilidade</button>

            <div style="overflow:auto; margin-top:10px;">
                <table id="tabelaDisponibilidades">
                    <thead>
                    <tr>
                        <th>Dia</th>
                        <th>Início</th>
                        <th>Fim</th>
                        <th>Intervalo (min)</th>
                        <th style="width:160px;">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr><td colspan="5" class="muted" style="padding:14px;text-align:center">Carregando...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<!-- 🔹 Modal de Prontuário -->
<div id="prontuarioBackdrop" class="modal-backdrop">
    <div class="modal" id="prontuarioModal">
        <div class="modal-header">
            <strong>Prontuário</strong>
            <button class="btn ghost" onclick="fecharProntuario()">Fechar</button>
        </div>

        <div>
            <label for="sintomas">Sintomas relatados</label>
            <textarea id="sintomas"></textarea>

            <label for="duracao">Tempo de duração dos sintomas</label>
            <input id="duracao" type="text">

            <label for="historico">Histórico médico relevante</label>
            <textarea id="historico"></textarea>

            <label for="diagnostico">Diagnóstico</label>
            <input id="diagnostico" type="text">

            <label for="prescricao">Prescrição / Orientações</label>
            <textarea id="prescricao"></textarea>

            <label for="observacoes">Observações adicionais</label>
            <textarea id="observacoes"></textarea>

            <div class="modal-actions">
                <button class="btn btn-danger btn-small" onclick="marcarAtendidaModal()">Marcar como atendida</button>
                <button class="btn btn-primary btn-small" onclick="salvarProntuario()">Salvar Prontuário</button>
            </div>
        </div>
    </div>
</div>

<!-- 🔹 Modal para adicionar disponibilidade -->
<div id="modalDisponibilidadeBackdrop" class="modal-backdrop">
    <div class="modal" id="modalDisponibilidade">
        <div class="modal-header">
            <strong>Nova Disponibilidade</strong>
            <button class="btn ghost" onclick="fecharModalDisponibilidade()">Fechar</button>
        </div>

        <div>
            <label>Dia da Semana</label>
            <select id="diaSemana">
                <option value="SEGUNDA">Segunda</option>
                <option value="TERÇA">Terça</option>
                <option value="QUARTA">Quarta</option>
                <option value="QUINTA">Quinta</option>
                <option value="SEXTA">Sexta</option>
                <option value="SABADO">Sábado</option>
                <option value="DOMINGO">Domingo</option>
            </select>

            <label>Hora Início</label>
            <input id="horaInicio" type="time">

            <label>Hora Fim</label>
            <input id="horaFim" type="time">

            <label>Intervalo (minutos)</label>
            <input id="intervalo" type="number" min="10" step="5" value="30">

            <div class="modal-actions">
                <button class="btn btn-primary btn-small" onclick="salvarDisponibilidade()">Salvar</button>
            </div>
        </div>
    </div>
</div>

<script src="/js/areaMedico.js"></script>
</body>
</html>
