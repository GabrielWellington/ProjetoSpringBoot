<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Disponibilidades</title>
    <link rel="stylesheet" href="/css/disponibilidade.css">
</head>
<body>
<div class="container">
    <h1>Gerenciar Disponibilidades do Médico</h1>

    <div class="form-container">
        <label>Dia da Semana:</label>
        <select id="diaSemana">
            <option value="Segunda">Segunda</option>
            <option value="Terça">Terça</option>
            <option value="Quarta">Quarta</option>
            <option value="Quinta">Quinta</option>
            <option value="Sexta">Sexta</option>
            <option value="Sábado">Sábado</option>
        </select>

        <label>Hora Início:</label>
        <input type="time" id="horaInicio">

        <label>Hora Fim:</label>
        <input type="time" id="horaFim">

        <label>Intervalo (minutos):</label>
        <input type="number" id="intervaloMinutos" min="5" value="30">

        <button id="btnAdicionar">Adicionar Disponibilidade</button>
    </div>

    <h2>Minhas Disponibilidades</h2>
    <table id="tabelaDisponibilidades">
        <thead>
        <tr>
            <th>Dia</th>
            <th>Início</th>
            <th>Fim</th>
            <th>Intervalo</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <!-- preenchido dinamicamente -->
        </tbody>
    </table>
</div>

<script src="/js/disponibilidade.js"></script>
</body>
</html>
