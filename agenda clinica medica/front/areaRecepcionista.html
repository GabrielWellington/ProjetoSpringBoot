<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Agenda Médica - Recepcionista</title>
    <link rel="stylesheet" href="/css/areaRecepcionista.css">
    <link rel="shortcut icon" href="/img/estetoscopio.png" type="image/x-icon">
</head>
<body>

<h1>Área da Recepcionista</h1>

<div class="secao">
    <h2>Consultas Pendentes</h2>
    <table id="tabelaPendentes">
        <thead>
        <tr>
            <th>ID</th>
            <th>Paciente</th>
            <th>Médico</th>
            <th>Data</th>
            <th>Hora</th>
            <th>Status</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<div class="secao">
    <h2>Consultas Confirmadas</h2>
    <table id="tabelaConfirmadas">
        <thead>
        <tr>
            <th>ID</th>
            <th>Paciente</th>
            <th>Médico</th>
            <th>Data</th>
            <th>Hora</th>
            <th>Data Confirmação</th>
            <th>Status</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script src="/js/areaRecepcionista.js"></script>
</body>
</html>
