<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Agenda Médica - Cadastro</title>
    <link rel="stylesheet" href="/css/cadastro.css">
    <link rel="shortcut icon" href="/img/estetoscopio.png" type="image/x-icon">
</head>
<body>
<div class="container">
    <h1>Cadastro de Usuário</h1>

    <form id="formCadastro" method="post" action="/cadastro">
        <label for="tipo">Tipo de Usuário:</label>
        <select id="tipo" name="tipo" required>
            <option value="">Selecione...</option>
            <option value="medico">Médico</option>
            <option value="paciente">Paciente</option>
            <option value="recepcionista">Recepcionista</option>
        </select>

        <div id="camposComuns">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>
        </div>

        <div id="camposMedico" class="oculto">
            <label for="crm">CRM:</label>
            <input type="text" id="crm" name="crm">

            <label for="especialidade">Especialidade:</label>
            <select id="especialidade" name="especialidadeId">
                <option value="">Selecione...</option>
            </select>

            <script>
                fetch("/especialidades")
                    .then(res => res.json())
                    .then(lista => {
                        const select = document.getElementById("especialidade");
                        lista.forEach(e => {
                            const op = document.createElement("option");
                            op.value = e.id;
                            op.textContent = e.nome;
                            select.appendChild(op);
                        });
                    });
            </script>

        </div>

        <div id="camposPaciente" class="oculto">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf">

            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" name="telefone">

            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" name="endereco">
        </div>

        <button type="submit">Cadastrar</button>
    </form>

    <a href="/login" class="voltar">Já tem conta? Faça login</a>
</div>

<script src="/js/cadastro.js"></script>
</body>
</html>
